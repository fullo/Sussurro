name: Release

# Builds signed installers for Windows / macOS / Linux and publishes a GitHub
# release (with the updater's latest.json) whenever a v* tag is pushed; the
# browser-extension zips are attached to the same draft release, plus the
# Firefox add-on signed on addons.mozilla.org (unlisted) when the AMO secrets
# are set (#228).
#
# Run by hand (workflow_dispatch) from a branch, it builds exactly the same
# thing but creates no tag and no release (#210): tauri-action gets no
# tagName/releaseName, so it only builds, and the bundles + extension zips are
# uploaded as short-lived workflow artifacts instead, and nothing is signed on
# AMO. Dispatched from a tag it behaves like a tag push.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `triple` picks the pinned llama-server sidecar (#116,
          # src-tauri/sidecar/llama-server.lock.json); every build merges
          # tauri.sidecar.conf.json to bundle it.
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            args: "--config src-tauri/tauri.sidecar.conf.json"
          # arm64 only: ort (onnxruntime) has no prebuilt binaries for
          # x86_64-apple-darwin, so Intel macOS is not supported.
          - platform: macos-latest # arm64 (Apple Silicon)
            triple: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --config src-tauri/tauri.sidecar.conf.json"
          # 24.04: the ort (onnxruntime) prebuilt binaries need glibc >= 2.38
          - platform: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            args: "--config src-tauri/tauri.sidecar.conf.json"

    runs-on: ${{ matrix.platform }}

    env:
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache

    steps:
      - uses: actions/checkout@v5

      # cdn.pyke.io (ort's prebuilt ONNX Runtime) intermittently 403s GitHub
      # runners; a populated cache skips the download entirely.
      - name: ONNX Runtime binaries cache
        uses: actions/cache@v6
        with:
          path: .ort-cache
          key: ort-bin-${{ runner.os }}-${{ hashFiles('sussurro/src-tauri/Cargo.lock') }}
          restore-keys: ort-bin-${{ runner.os }}-

      # On Windows a SHORT cargo target dir is mandatory: the Vulkan shader
      # sub-build exceeds MAX_PATH otherwise (MSBuild FTK1011).
      - name: Cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo 'CARGO_TARGET_DIR=C:\st' >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            libxdo-dev libxkbcommon-dev patchelf

      - name: Vulkan SDK (Windows GPU build)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $urls = @(
            'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe',
            'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe'
          )
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile vulkan_sdk.exe -ErrorAction Stop; break } catch {}
          }
          Start-Process .\vulkan_sdk.exe -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sussurro/src-tauri

      - name: Install frontend dependencies
        working-directory: sussurro
        run: npm ci

      # Pinned upstream llama.cpp build (E9, #116): downloaded and checked
      # against the SHA-256 in the lock; a mismatch fails the job before
      # anything is built (fail-closed).
      - name: llama-server sidecar (fetch + verify)
        working-directory: sussurro
        run: npm run sidecar -- --target ${{ matrix.triple }}

      # linuxdeploy (AppImage) runs ldd on every ELF in usr/bin and fails on
      # a NEEDED lib it can't find; the sidecar's libs sit in the resource
      # folder, so point the loader there for the build.
      - name: Sidecar libs on the loader path (Linux AppImage)
        if: matrix.platform == 'ubuntu-24.04'
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/sussurro/src-tauri/binaries/llama-server-libs" >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: sussurro
          # Empty off a tag: tauri-action then only builds (no release, no
          # tag, no latest.json upload); the updater .sig files are still
          # produced by the build itself from TAURI_SIGNING_PRIVATE_KEY.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Sussurro {0}', github.ref_name) || '' }}
          releaseBody: "Local voice dictation. See README for setup (Ollama + a Whisper/Parakeet model)."
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Bundles contain the verified sidecar
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows-latest) TD="$(cygpath -u "$CARGO_TARGET_DIR")" ;;
            macos-latest) TD=sussurro/src-tauri/target/aarch64-apple-darwin ;;
            *) TD=sussurro/src-tauri/target ;;
          esac
          bash scripts/verify-sidecar-bundle.sh "${{ matrix.triple }}" "$TD"

      # Build-only run (no tag): keep the bundles (installers, updater
      # archives + .sig) as workflow artifacts instead of release assets.
      - name: Bundle directory (build-only run)
        id: bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows-latest) TD="$(cygpath -m "$CARGO_TARGET_DIR")" ;;
            macos-latest) TD=sussurro/src-tauri/target/aarch64-apple-darwin ;;
            *) TD=sussurro/src-tauri/target ;;
          esac
          echo "dir=$TD/release/bundle" >> "$GITHUB_OUTPUT"

      - name: Upload bundles (build-only run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sussurro-${{ matrix.triple }}
          path: ${{ steps.bundle.outputs.dir }}
          if-no-files-found: error
          retention-days: 3

  # Browser extension zips (Chrome/Edge/Brave + Firefox), attached to the draft
  # release the build job created (a workflow artifact on a build-only run).
  # Store listings are not part of the release.
  extension:
    needs: build
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build and lint
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run build
          npm run lint

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" extension/dist/*.zip --clobber --repo "${{ github.repository }}"

      # Firefox: sign the build on addons.mozilla.org, unlisted channel
      # (self-distribution, #228), and attach the signed .xpi. Only on a tag,
      # only with both AMO secrets, only for a plain X.Y.Z version; any skip
      # is a ::notice::, never a failure. Secrets can't appear in `if:`, so
      # the gate script decides and the step below reads its output.
      - name: Firefox signing gate
        id: amo
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bash extension/scripts/amo-sign-gate.sh

      - name: Sign the Firefox extension (AMO unlisted) and attach the .xpi
        if: steps.amo.outputs.sign == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # web-ext reads --api-key / --api-secret from these.
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.amo.outputs.version }}
        run: |
          xpi="sussurro-extension-firefox-$VERSION.xpi"
          # AMO signs a version number once: a re-run after a successful
          # signing must not submit it again.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$xpi"; then
            echo "::notice title=Firefox signing skipped::$xpi is already attached to $GITHUB_REF_NAME."
            exit 0
          fi
          # The build bundles and minifies, so AMO gets the sources it was
          # built from (the extension + the app files it imports, the icons
          # and the version); build steps: extension/README.md, "Source code
          # for AMO review".
          git archive --format=zip -o "$RUNNER_TEMP/sussurro-extension-source-$VERSION.zip" HEAD \
            LICENSE extension sussurro/package.json sussurro/src \
            sussurro/src-tauri/icons/32x32.png sussurro/src-tauri/icons/64x64.png sussurro/src-tauri/icons/128x128.png
          cd extension
          npx web-ext sign --channel=unlisted --source-dir dist/firefox \
            --artifacts-dir "$RUNNER_TEMP/signed" \
            --upload-source-code "$RUNNER_TEMP/sussurro-extension-source-$VERSION.zip" \
            --approval-timeout 2400000
          shopt -s nullglob
          signed=("$RUNNER_TEMP"/signed/*.xpi)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::error::expected one signed .xpi, got ${#signed[@]}"
            exit 1
          fi
          mv "${signed[0]}" "dist/$xpi"
          gh release upload "$GITHUB_REF_NAME" "dist/$xpi" --clobber --repo "$GITHUB_REPOSITORY"
          echo "::notice title=Firefox extension signed::$xpi attached to $GITHUB_REF_NAME. After publishing the release: cd extension && npm run update-manifest -- $VERSION, then merge docs/extension/updates.json."

      - name: Upload extension zips (build-only run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/dist/*.zip
          if-no-files-found: error
          retention-days: 3
