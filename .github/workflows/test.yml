name: Test

# Fast feedback on every push/PR: frontend type-check + full Rust test suite,
# plus the browser extension (build + web-ext lint) in a parallel job.
# Runs on Ubuntu (CPU-only whisper build — no Vulkan SDK needed).
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Browser extension (extension/): type-check, unit tests, both builds,
  # `web-ext lint` on the Firefox build and the Playwright capture harness
  # (e2e/). Its own job, so it runs in parallel
  # with the Rust one and needs no Rust toolchain.
  extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (Chrome + Firefox)
        run: npm run build

      - name: web-ext lint (Firefox build)
        run: npm run lint

      # Capture harness (#128): both builds in headless Chromium and Firefox
      # against a local two-peer call and a fake /live; ~30 s plus the
      # browser download.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # Firefox on Linux needs an audio server for WebAudio and <audio>
      # output (without one, AudioContexts stay suspended); the runner has
      # none. PulseAudio with its automatic null sink is enough.
      - name: Audio server (null sink)
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info | grep -E "Server Name|Default Sink"

      - name: Capture harness (Chromium + Firefox)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: extension/dist/*.zip
          retention-days: 14

  test:
    # 24.04: the ort (onnxruntime) prebuilt binaries need glibc >= 2.38
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # cdn.pyke.io (ort's own prebuilt download) 403s GitHub runners, so link
      # dynamically against Microsoft's official ONNX Runtime release instead.
      # Keep the version in sync with what the locked ort-sys expects (see the
      # ms@<version> URLs in its build/download/dist.txt).
      - name: ONNX Runtime (Microsoft build)
        run: |
          ORT_VERSION=1.24.2
          curl -fsSL --retry 5 --retry-delay 10 -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar xzf ort.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-${ORT_VERSION}/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-${ORT_VERSION}/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            libxdo-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: sussurro/src-tauri

      - name: Frontend build (type-check)
        working-directory: sussurro
        run: |
          npm ci
          npm run build

      # llama-server sidecar (#116): the fetch script's own tests, then the
      # real pinned Linux asset — downloaded, SHA-256-verified and started.
      # cargo test/clippy don't need it (tauri.conf.json has no externalBin;
      # only tauri.sidecar.conf.json, merged when bundling, does).
      - name: Sidecar (fetch script tests + pinned llama-server starts)
        working-directory: sussurro
        run: |
          npx vitest run scripts/
          npm run sidecar
          cd src-tauri/binaries/llama-server-libs
          LD_LIBRARY_PATH="$PWD:$LD_LIBRARY_PATH" ../sussurro-llama-server-x86_64-unknown-linux-gnu --version

      - name: Rust tests
        working-directory: sussurro/src-tauri
        run: cargo test

      - name: Clippy
        working-directory: sussurro/src-tauri
        run: cargo clippy --all-targets

      # Minimal E2E: the real app binary starts under Xvfb and creates its
      # window. Catches broken plugin init, asset embedding, webview wiring —
      # things unit tests can't see.
      - name: E2E smoke (app launches, window exists)
        working-directory: sussurro
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          sudo apt-get install -y xvfb xdotool
          npm run tauri build -- --debug --no-bundle
          xvfb-run -a bash -c '
            ./src-tauri/target/debug/sussurro &
            APP_PID=$!
            for i in $(seq 1 30); do
              if xdotool search --name "Sussurro" >/dev/null 2>&1; then
                echo "OK: window found after ${i}s"
                kill $APP_PID
                exit 0
              fi
              if ! kill -0 $APP_PID 2>/dev/null; then
                echo "FAIL: app process died"
                exit 1
              fi
              sleep 1
            done
            echo "FAIL: window never appeared"
            kill $APP_PID
            exit 1
          '

      # Linux packaging with the sidecar (#116), as the release builds it:
      # .deb + AppImage (linuxdeploy needs the sidecar libs on the loader
      # path), then check the bundles hold the verified binary and it starts.
      # Debug profile to reuse the E2E build; no updater artifacts (no key).
      - name: Linux bundles contain the sidecar
        working-directory: sussurro
        run: |
          sudo apt-get install -y patchelf
          LD_LIBRARY_PATH="$PWD/src-tauri/binaries/llama-server-libs:$LD_LIBRARY_PATH" \
            npm run tauri build -- --debug --bundles deb,appimage \
            --config src-tauri/tauri.sidecar.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          bash ../scripts/verify-sidecar-bundle.sh x86_64-unknown-linux-gnu src-tauri/target debug
