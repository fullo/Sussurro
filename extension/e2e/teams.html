<!doctype html>
<!-- A fake Teams web page for the capture harness (#287, names #245),
     served at https://teams.cloud.microsoft/ by a Playwright route, so the
     shipped content-script patterns match it. Synthetic: the structure the
     provisional selector set `teams-2026-09a` expects (stream wrappers
     with test ids, a local-stream attribute, a name leaf with a Teams-style
     qualifier, a voice-level outline), not Teams' markup. A loopback call
     inside the page gives it a sent track (mic channel) and a received one
     (remote channel). Teams' mix is faked on RTCRtpReceiver.prototype:
     every live remote receiver carries the same CSRCs (the mix and its
     redundant track, #239), on a script — Bo speaks (CSRC 3001), a pause,
     Cy (3002), a pause, again — and the outline follows 400 ms late. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>e2e teams</title>
  </head>
  <body>
    <button id="join">Join</button>
    <div role="main">
      <div data-tid="participant-stream" data-participant-id="8:orgid:e2e-ada" data-is-local="true">
        <div data-tid="voice-level-outline" data-speaking="false"></div>
        <span data-tid="participant-name">Ada E2e</span>
      </div>
      <div data-tid="participant-stream" data-participant-id="8:orgid:e2e-bo">
        <div class="lvl" data-tid="voice-level-outline" data-speaking="false"></div>
        <span data-tid="participant-name">Bo E2e (Guest)</span>
      </div>
      <div data-tid="participant-stream" data-participant-id="8:orgid:e2e-cy">
        <div class="lvl" data-tid="voice-level-outline" data-speaking="false"></div>
        <span data-tid="participant-name">Cy E2e</span>
      </div>
    </div>
    <audio id="out" autoplay></audio>
    <script>
      // 5 s cycle: 0–1.8 s Bo, 1.8–2.5 s nobody, 2.5–4.3 s Cy, 4.3–5 s nobody.
      const SCRIPT = [
        [1800, 3001, 1],
        [700, 0, -1],
        [1800, 3002, 2],
        [700, 0, -1],
      ];
      const LAG = 400;
      const t0 = performance.now();
      function at(ms) {
        let t = (((ms - t0) % 5000) + 5000) % 5000;
        for (const [len, csrc, tile] of SCRIPT) {
          if (t < len) return { csrc, tile };
          t -= len;
        }
        return { csrc: 0, tile: -1 };
      }
      const remote = new Set();
      RTCRtpReceiver.prototype.getContributingSources = function () {
        if (!this.track || !remote.has(this.track.id)) return [];
        const { csrc } = at(performance.now());
        return csrc ? [{ source: csrc, timestamp: performance.now() - 20, audioLevel: 0.5, rtpTimestamp: 0 }] : [];
      };
      const lvls = document.querySelectorAll(".lvl");
      setInterval(() => {
        const { tile } = at(performance.now() - LAG);
        lvls.forEach((el, i) => el.setAttribute("data-speaking", String(i + 1 === tile)));
      }, 100);

      window.callState = () => ({ joined: !!window.pcs });
      document.getElementById("join").onclick = async () => {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        osc.frequency.value = 300;
        const dst = ctx.createMediaStreamDestination();
        osc.connect(dst);
        osc.start();
        const a = new RTCPeerConnection();
        const b = new RTCPeerConnection();
        a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate);
        b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate);
        b.ontrack = (e) => {
          remote.add(e.track.id);
          document.getElementById("out").srcObject = e.streams[0] || new MediaStream([e.track]);
        };
        a.addTrack(dst.stream.getAudioTracks()[0], dst.stream);
        await a.setLocalDescription(await a.createOffer());
        await b.setRemoteDescription(a.localDescription);
        await b.setLocalDescription(await b.createAnswer());
        await a.setRemoteDescription(b.localDescription);
        window.pcs = [a, b];
      };
    </script>
  </body>
</html>
